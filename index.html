<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>潤頫單字泡泡龍</title>
    <style>
        body {
            font-family: "Fredoka", "Segoe UI", "Microsoft JhengHei", sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: linear-gradient(135deg, #e0f7fa 0%, #b2ebf2 100%);
            min-height: 100vh;
            margin: 0;
            padding: 15px 10px;
            box-sizing: border-box;
        }
        h1 {
            color: #00838f;
            margin: 5px 0 10px 0;
            font-size: 26px;
            text-shadow: 2px 2px 0px #ffffff;
        }
        .controls {
            margin-bottom: 12px;
            display: flex;
            gap: 15px;
            align-items: center;
            background: rgba(255, 255, 255, 0.85);
            padding: 8px 24px;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            backdrop-filter: blur(5px);
        }
        .btn-next {
            padding: 8px 26px;
            font-size: 16px;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(to bottom, #4dd0e1, #00acc1);
            border: none;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 4px 0 #00838f, 0 6px 8px rgba(0, 0, 0, 0.15);
            transition: all 0.1s ease;
            position: relative;
            top: 0;
        }
        .btn-next:hover {
            background: linear-gradient(to bottom, #26c6da, #0097a7);
        }
        .btn-next:active {
            top: 2px;
            box-shadow: 0 2px 0 #00838f, 0 3px 5px rgba(0, 0, 0, 0.15);
        }
        .btn-next:disabled {
            background: #b0bec5;
            box-shadow: 0 3px 0 #78909c;
            cursor: not-allowed;
            top: 0;
        }
        .status {
            font-size: 15px;
            font-weight: bold;
            color: #006064;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 8px;
            max-width: 960px;
            width: 100%;
            background-color: rgba(255, 255, 255, 0.4);
            padding: 12px;
            border-radius: 20px;
            box-shadow: inset 0 0 15px rgba(255, 255, 255, 0.8), 0 8px 25px rgba(0,0,0,0.08);
            border: 3px solid #ffffff;
            box-sizing: border-box;
        }
        .card {
            background: linear-gradient(to bottom, #ffffff 0%, #e0f2f1 100%);
            border-radius: 10px;
            min-height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 800;
            color: #004d40;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-align: center;
            padding: 2px 6px;
            box-shadow: inset 0 2px 2px rgba(255, 255, 255, 0.9), inset 0 -2px 3px rgba(0, 150, 136, 0.2), 0 3px 5px rgba(0, 0, 0, 0.08);
            border: 2px solid #b2dfdb;
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }
        /* 修正：移除多餘空格，確保 .card.active 正常運作 */
